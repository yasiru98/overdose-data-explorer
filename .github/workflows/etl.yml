name: Refresh CDC overdose data

on:
  schedule:
    # 1st of every month, matching CDC's own monthly release cadence for
    # this dataset. runs at 12:00 UTC to give them a little buffer after
    # the month rolls over
    - cron: '0 12 1 * *'
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ETL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m etl.run
